name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test MeshCoreMqtt.sln -c Release --verbosity minimal

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/api.Dockerfile
          - name: proxy
            file: docker/proxy.Dockerfile
          - name: web
            file: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/termin36/meshcore-mqtt-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/termin36/meshcore-mqtt-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/meshcore-mqtt-${{ matrix.name }}" \
            -f visibility=public

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          prev="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${version}$" | head -n 1 || true)"
          range="HEAD"
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
          fi
          {
            echo "ghcr.io/termin36/meshcore-mqtt-api:${version}"
            echo "ghcr.io/termin36/meshcore-mqtt-proxy:${version}"
            echo "ghcr.io/termin36/meshcore-mqtt-web:${version}"
            echo
            git log --pretty=format:'- %s' "$range"
            echo
          } > notes.md
          gh release create "$version" --title "$version" --notes-file notes.md
